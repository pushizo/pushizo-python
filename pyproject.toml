[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pushizo"
version = "0.1.0"
description = "Pushizo sunucu SDK'sı: bildirim gönderme, kullanıcı/abonelik yönetimi, segment/şablon/kampanya ve webhook imza doğrulaması"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Pushizo" }]
keywords = ["pushizo", "push", "notifications", "email", "sms", "webhooks"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.24,<1"]

[project.urls]
Homepage = "https://docs.pushizo.com/docs/sdk/python"
Documentation = "https://docs.pushizo.com/docs/sdk/python"
Repository = "https://github.com/exec0de/pushizo"
Changelog = "https://docs.pushizo.com/docs/changelog"

[project.optional-dependencies]
dev = ["pytest>=7", "cryptography>=41"]
jwt = ["cryptography>=41"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pushizo = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
